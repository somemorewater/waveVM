[package]
name = "wave-vm"
version = "0.1.0"
description = "Local-first desktop virtualization"
authors = ["Wave VM contributors"]
edition = "2021"
rust-version = "1.77.2"
default-run = "wave-vm"

[lib]
name = "wave_vm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sysinfo = "0.39"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
thiserror = "2"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"
